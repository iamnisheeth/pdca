  <line x1="28"  y1="189" x2="44"  y2="167" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>
  <line x1="57"  y1="200" x2="44"  y2="167" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>
  <line x1="44"  y1="167" x2="83"  y2="163" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>
  <line x1="57"  y1="200" x2="83"  y2="163" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>
