  <line x1="302" y1="118" x2="378" y2="111" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <line x1="325" y1="187" x2="378" y2="111" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <line x1="378" y1="111" x2="396" y2="169" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
