  <text x="185" y="28" fill="white"   font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">WORLD BICYCLE DAY</text>
  <line x1="88"  y1="34" x2="282" y2="34" stroke="#0d9488" stroke-width="1" opacity="0.55"/>
  <text x="185" y="48" fill="#f97316" font-family="Arial,sans-serif" font-size="9"  font-weight="bold" text-anchor="middle" letter-spacing="2">FIT INDIA CYCLOTHON</text>

  <!-- Date pill -->
  <rect x="133" y="213" width="104" height="14" rx="7" fill="#f97316"/>
  <text x="185" y="224" fill="white" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1">JUNE 3, 2026</text>
