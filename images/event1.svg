<svg viewBox="0 0 400 230" width="400" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0b1e1e"/>
    </linearGradient>
  </defs>

  <rect width="400" height="230" fill="url(#bg1)"/>

  <!-- Decorative circle motif top-right -->
  <circle cx="375" cy="45" r="72" fill="none" stroke="#0d9488" stroke-width="1" opacity="0.14"/>
  <circle cx="375" cy="45" r="50" fill="none" stroke="#f97316" stroke-width="0.8" opacity="0.09"/>

  <!-- Ground -->
  <line x1="0" y1="205" x2="400" y2="205" stroke="#0d9488" stroke-width="1" opacity="0.35"/>

  <!-- Speed lines (left edge) -->
  <line x1="4"  y1="132" x2="52" y2="132" stroke="#5eead4" stroke-width="2"   stroke-linecap="round" opacity="0.5"/>
  <line x1="2"  y1="145" x2="38" y2="145" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="8"  y1="158" x2="44" y2="158" stroke="#5eead4" stroke-width="1"   stroke-linecap="round" opacity="0.22"/>

  <!-- REAR WHEEL  cx=105 cy=169 r=36 (bottom touches y=205) -->
  <circle cx="105" cy="169" r="36" fill="none" stroke="#5eead4" stroke-width="2.5"/>
  <circle cx="105" cy="169" r="4"  fill="#0d9488"/>
  <line x1="105" y1="133" x2="105" y2="205" stroke="#5eead4" stroke-width="0.8" opacity="0.28"/>
  <line x1="69"  y1="169" x2="141" y2="169" stroke="#5eead4" stroke-width="0.8" opacity="0.28"/>
  <line x1="80"  y1="144" x2="130" y2="194" stroke="#5eead4" stroke-width="0.8" opacity="0.18"/>
  <line x1="130" y1="144" x2="80"  y2="194" stroke="#5eead4" stroke-width="0.8" opacity="0.18"/>

  <!-- FRONT WHEEL  cx=225 cy=169 r=36 (bottom touches y=205) -->
  <circle cx="225" cy="169" r="36" fill="none" stroke="#5eead4" stroke-width="2.5"/>
  <circle cx="225" cy="169" r="4"  fill="#0d9488"/>
  <line x1="225" y1="133" x2="225" y2="205" stroke="#5eead4" stroke-width="0.8" opacity="0.28"/>
  <line x1="189" y1="169" x2="261" y2="169" stroke="#5eead4" stroke-width="0.8" opacity="0.28"/>
  <line x1="200" y1="144" x2="250" y2="194" stroke="#5eead4" stroke-width="0.8" opacity="0.18"/>
  <line x1="250" y1="144" x2="200" y2="194" stroke="#5eead4" stroke-width="0.8" opacity="0.18"/>

  <!-- FRAME — 6 tubes, orange -->
  <!-- 1. Chain stay: rear axle → BB -->
  <line x1="105" y1="169" x2="162" y2="188" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <!-- 2. Seat stay: rear axle → seat cluster -->
  <line x1="105" y1="169" x2="142" y2="112" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <!-- 3. Seat tube: BB → seat cluster -->
  <line x1="162" y1="188" x2="142" y2="112" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <!-- 4. Top tube: seat cluster → head tube -->
  <line x1="142" y1="112" x2="208" y2="106" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <!-- 5. Down tube: BB → head tube -->
  <line x1="162" y1="188" x2="208" y2="106" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <!-- 6. Fork: head tube → front axle -->
  <line x1="208" y1="106" x2="225" y2="169" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

  <!-- Chain ring at BB -->
  <circle cx="162" cy="188" r="11" fill="none" stroke="#f97316" stroke-width="2"/>

  <!-- Saddle -->
  <line x1="131" y1="109" x2="155" y2="109" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Handlebars -->
  <line x1="208" y1="101" x2="216" y2="94"  stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="212" y1="91"  x2="220" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- GIRL — standing to the right of the bike, facing left -->
  <!-- Ponytail (right side of head, flowing back) -->
  <path d="M 308,88 Q 324,86 326,102" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="298" cy="90" r="12" fill="white"/>
  <!-- Helmet (teal arc over top of head) -->
  <path d="M 286,90 Q 298,74 310,90" fill="#0d9488"/>
  <!-- Helmet strap hints -->
  <line x1="286" y1="91" x2="287" y2="99" stroke="#0d9488" stroke-width="1.5" opacity="0.7"/>
  <line x1="310" y1="91" x2="309" y2="99" stroke="#0d9488" stroke-width="1.5" opacity="0.7"/>
  <!-- Torso -->
  <line x1="298" y1="102" x2="298" y2="156" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left arm — extended toward bike (holding handlebars gesture) -->
  <line x1="298" y1="120" x2="268" y2="120" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="268" y1="120" x2="250" y2="132" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right arm — relaxed at side -->
  <line x1="298" y1="120" x2="314" y2="142" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="314" y1="142" x2="318" y2="158" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="298" y1="156" x2="288" y2="182" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="288" y1="182" x2="285" y2="205" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="298" y1="156" x2="308" y2="182" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="308" y1="182" x2="312" y2="205" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shoes -->
  <line x1="280" y1="205" x2="293" y2="205" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="307" y1="205" x2="320" y2="205" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- TEXT -->
  <text x="170" y="22" fill="white"   font-family="Arial,sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" letter-spacing="2">WORLD BICYCLE DAY</text>
  <line x1="68"  y1="28" x2="272"  y2="28" stroke="#0d9488" stroke-width="1" opacity="0.55"/>
  <text x="170" y="42" fill="#f97316" font-family="Arial,sans-serif" font-size="8.5"  font-weight="bold" text-anchor="middle" letter-spacing="2">WOMEN'S CYCLING LEAGUE</text>

  <!-- Date pill -->
  <rect x="114" y="213" width="112" height="14" rx="7" fill="#0d9488"/>
  <text x="170" y="224" fill="white" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1">JUNE 3, 2026</text>
</svg>
